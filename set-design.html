<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Design — Sets and Stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:    #1C0D07;
            --cream: #E0CEAB;
            --tile-bg: #2A1208;
        }

        html, body {
            min-height: 100%;
            background: var(--bg);
            font-family: 'Noto Serif Display', serif;
            font-weight: 100;
            color: var(--cream);
        }

        /* ── HEADER ─────────────────────────────────────── */
        header {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 200;
            padding: 1.8rem 2.8rem;
            display: flex;
            align-items: center;
            background: linear-gradient(
                to bottom,
                rgba(28, 13, 7, 1)   0%,
                rgba(28, 13, 7, 0.8) 60%,
                rgba(28, 13, 7, 0)   100%
            );
        }

        .logo {
            text-decoration: none;
            transition: opacity 0.3s ease;
        }

        .logo img {
            height: 2.8rem;
            width: auto;
            display: block;
        }

        .logo:hover { opacity: 0.55; }

        /* ── PAGE LABEL ─────────────────────────────────── */
        .page-label {
            padding-top: 8.5rem;
            padding-bottom: 2.8rem;
            padding-left: 2.8rem;
            font-size: 3rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--cream);
            opacity: 1;
        }

        /* ── TILE GRID ──────────────────────────────────── */
        .grid {
            padding: 0 2.8rem 5rem;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
        }

        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(3, 1fr); padding: 0 1.6rem 4rem; }
        }

        @media (max-width: 600px) {
            .grid { grid-template-columns: repeat(2, 1fr); padding: 0 1rem 3rem; gap: 0.6rem; }
            .page-label { padding-left: 1rem; }
            header { padding: 1.4rem 1.4rem; }
            .overlay-card { padding: 3rem 1.6rem 4rem; }
        }

        /* ── TILE ───────────────────────────────────────── */
        .tile {
            position: relative;
            aspect-ratio: 1;
            overflow: hidden;
            cursor: pointer;
            background: var(--tile-bg);
        }

        .tile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
            transition:
                transform 0.75s cubic-bezier(0.76, 0, 0.17, 1),
                filter    0.5s ease;
        }

        .tile:hover .tile-img {
            transform: scale(1.05);
            filter: brightness(0.82);
        }

        .tile-gradient {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to top,
                rgba(28, 13, 7, 0.58) 0%,
                rgba(28, 13, 7, 0.04) 55%,
                transparent 100%
            );
            pointer-events: none;
        }

        .tile-name {
            position: absolute;
            bottom: 1rem;
            left: 1rem;
            right: 1rem;
            font-size: 0.85rem;
            color: #fff;
            pointer-events: none;
        }

        /* ── OVERLAY BACKDROP ───────────────────────────── */
        .overlay-backdrop {
            position: fixed;
            inset: 0;
            z-index: 500;
            background: rgba(20, 9, 4, 0.72);
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 5vh 1.5rem;
            overflow-y: auto;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
        }

        .overlay-backdrop.open {
            opacity: 1;
            pointer-events: all;
        }

        /* ── OVERLAY CARD ───────────────────────────────── */
        .overlay-card {
            position: relative;
            background: #F0EBE1;
            width: 100%;
            max-width: 860px;
            padding: 4.5rem 4.5rem 5.5rem;
            transform: translateY(18px);
            transition: transform 0.4s cubic-bezier(0.76, 0, 0.17, 1);
            flex-shrink: 0;
        }

        .overlay-backdrop.open .overlay-card {
            transform: translateY(0);
        }

        /* ── CLOSE BUTTON ───────────────────────────────── */
        .close-btn {
            position: absolute;
            top: 1.4rem;
            right: 1.8rem;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 1.6rem;
            color: #1C0D07;
            opacity: 0.4;
            line-height: 1;
            padding: 0.2rem 0.4rem;
            transition: opacity 0.25s ease;
            font-family: inherit;
            font-weight: 100;
        }

        .close-btn:hover { opacity: 0.9; }

        /* ── OVERLAY TITLE ──────────────────────────────── */
        .overlay-title {
            font-family: 'Noto Serif Display', serif;
            font-weight: 100;
            font-size: clamp(2rem, 4vw, 3.2rem);
            color: #1C0D07;
            margin-bottom: 3.5rem;
            letter-spacing: 0;
        }

        /* ── MEDIA BLOCKS ───────────────────────────────── */
        .media-block {
            margin-bottom: 3.2rem;
        }

        .media-block:last-child {
            margin-bottom: 0;
        }

        .media-block video,
        .media-block img {
            width: 100%;
            height: auto;
            display: block;
        }

        .media-caption {
            margin-top: 1.1rem;
            font-size: 0.88rem;
            line-height: 1.85;
            color: #1C0D07;
            opacity: 0.55;
            max-width: 600px;
        }
    </style>
</head>
<body>

    <header>
        <a href="index.html" class="logo">
            <img src="content/logo.png" alt="Sets and Stories">
        </a>
    </header>

    <p class="page-label">Set Design</p>

    <main class="grid" id="tile-grid"></main>

    <!-- Overlay -->
    <div class="overlay-backdrop" id="overlay">
        <div class="overlay-card">
            <button class="close-btn" id="close-btn">&#215;</button>
            <h2 class="overlay-title" id="overlay-title"></h2>
            <div id="overlay-body"></div>
        </div>
    </div>

    <script>
        const projects = [
            {
                name: 'Bloomingdales',
                swatch: 'content/Set design/Bloomingdales/swatch.png',
                media: [
                    {
                        type: 'video',
                        src: 'content/Set design/Bloomingdales/media1.mp4',
                        caption: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
                    },
                    {
                        type: 'image',
                        src: 'content/Set design/Bloomingdales/WhatsApp Image 2026-05-27 at 12.03.42 AM.jpeg',
                        caption: 'Lorem ipsum dolor sit amet, consectetur adipiscing elit. Sed do eiusmod tempor incididunt ut labore et dolore magna aliqua. Ut enim ad minim veniam, quis nostrud exercitation ullamco laboris nisi ut aliquip ex ea commodo consequat.'
                    }
                ]
            }
        ];

        // 8 tiles — Bloomingdales is real, rest are placeholders reusing its content
        const placeholderNames = ['II','III','IV','V','VI','VII','VIII'];
        const tileData = [
            projects[0],
            ...placeholderNames.map(n => ({ ...projects[0], name: `Project ${n}` }))
        ];

        const grid = document.getElementById('tile-grid');

        tileData.forEach(p => {
            const tile = document.createElement('div');
            tile.className = 'tile';
            tile.innerHTML = `
                <img class="tile-img" src="${p.swatch}" alt="${p.name}">
                <div class="tile-gradient"></div>
                <span class="tile-name">${p.name}</span>
            `;
            tile.addEventListener('click', () => openOverlay(p));
            grid.appendChild(tile);
        });

        const overlayEl = document.getElementById('overlay');
        const closeBtnEl = document.getElementById('close-btn');
        const titleEl = document.getElementById('overlay-title');
        const bodyEl = document.getElementById('overlay-body');

        function openOverlay(project) {
            titleEl.textContent = project.name;
            bodyEl.innerHTML = project.media.map(m => `
                <div class="media-block">
                    ${m.type === 'video'
                        ? `<video controls playsinline src="${m.src}"></video>`
                        : `<img src="${m.src}" alt="${project.name}">`
                    }
                    <p class="media-caption">${m.caption}</p>
                </div>
            `).join('');
            overlayEl.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeOverlay() {
            overlayEl.classList.remove('open');
            document.body.style.overflow = '';
            overlayEl.querySelectorAll('video').forEach(v => v.pause());
        }

        closeBtnEl.addEventListener('click', closeOverlay);
        overlayEl.addEventListener('click', e => { if (e.target === overlayEl) closeOverlay(); });
        document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
    </script>

</body>
</html>
