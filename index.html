<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sets and Stories</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Italiana&family=Noto+Serif+Display:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg:          #1C0D07;
            --cream:       #E0CEAB;
            --cream-dim:   rgba(224, 206, 171, 0.45);
            --gold-line:   rgba(182, 132, 58, 0.32);
            --glow-auburn: rgba(165, 72, 18, 0.14);
        }

        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: var(--bg);
            font-family: 'Noto Serif Display', serif;
            font-weight: 100;
            cursor: default;
        }

        /* ── NAVIGATION ─────────────────────────────────── */
        nav {
            position: fixed;
            inset: 0 0 auto 0;
            z-index: 300;
            padding: 2.4rem 3.6rem;
            display: grid;
            grid-template-columns: 1fr auto 1fr;
            align-items: center;
            pointer-events: none;
        }

        .logo, .nav-contact {
            pointer-events: all;
            text-decoration: none;
        }

        .logo {
            display: flex;
            justify-content: center;
            transition: opacity 0.3s ease;
        }

        .logo img {
            height: 3.9rem;
            width: auto;
            display: block;
        }

        .logo:hover { opacity: 0.7; }

        .nav-contact {
            justify-self: end;
            font-family: 'Noto Serif Display', serif;
            font-weight: 100;
            font-size: 0.95rem;
            letter-spacing: 0.22em;
            text-transform: uppercase;
            color: var(--cream);
            position: relative;
        }

        .nav-contact::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            width: 0;
            height: 1px;
            background: var(--cream);
            transition: width 0.45s ease;
        }

        .nav-contact:hover::after { width: 100%; }

        /* ── SPLIT CONTAINER ────────────────────────────── */
        .split-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            position: relative;
        }

        /* ── PANELS ─────────────────────────────────────── */
        .panel {
            flex: 1;
            position: relative;
            overflow: hidden;
            cursor: pointer;
            text-decoration: none;
            transition: flex 0.95s cubic-bezier(0.76, 0, 0.17, 1);
        }

        /* Expand active to 70 %, compress inactive to 30 % */
        .split-container:has(.panel-left:hover)  .panel-left  { flex: 1.4; }
        .split-container:has(.panel-left:hover)  .panel-right { flex: 0.6; }
        .split-container:has(.panel-right:hover) .panel-right { flex: 1.4; }
        .split-container:has(.panel-right:hover) .panel-left  { flex: 0.6; }

        /* ── BACKGROUND IMAGE ───────────────────────────── */
        .panel-image {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            transition:
                transform  1.1s cubic-bezier(0.76, 0, 0.17, 1),
                filter     0.95s ease;
            filter: brightness(0.52) saturate(0.7) sepia(0.22);
            will-change: transform, filter;
        }

        .panel:hover .panel-image {
            transform: scale(1.045);
            filter: brightness(0.72) saturate(0.95) sepia(0.1);
        }

        .split-container:has(.panel-left:hover)  .panel-right .panel-image,
        .split-container:has(.panel-right:hover) .panel-left  .panel-image {
            filter: brightness(0.28) saturate(0.45) sepia(0.35);
        }

        /* ── DARK VIGNETTE OVERLAY ──────────────────────── */
        .panel-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(
                to bottom,
                rgba(28, 13, 7, 0.52)  0%,
                rgba(28, 13, 7, 0.08) 22%,
                rgba(28, 13, 7, 0.08) 58%,
                rgba(28, 13, 7, 0.68) 100%
            );
            z-index: 1;
            pointer-events: none;
        }

        /* ── WARM RADIAL GLOW on active panel ───────────── */
        .panel::before {
            content: '';
            position: absolute;
            inset: 0;
            background: radial-gradient(
                ellipse 70% 60% at 50% 55%,
                rgba(175, 78, 20, 0.16) 0%,
                transparent 70%
            );
            opacity: 0;
            z-index: 2;
            pointer-events: none;
            transition: opacity 0.95s ease;
        }

        .panel:hover::before { opacity: 1; }

        /* ── PANEL LABEL ────────────────────────────────── */
        .panel-label {
            position: absolute;
            inset: 0;
            z-index: 10;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            gap: 0;
        }

        .panel-title {
            font-family: 'Noto Serif Display', serif;
            font-weight: 100;
            font-size: clamp(1.6rem, 2.8vw, 3rem);
            color: var(--cream);
            letter-spacing: 0;
            white-space: nowrap;
            opacity: 0.88;
            transition:
                opacity 0.7s ease,
                color   0.7s ease;
        }

        .panel:hover .panel-title {
            opacity: 1;
            color: #ffffff;
        }

        .split-container:has(.panel-left:hover)  .panel-right .panel-title,
        .split-container:has(.panel-right:hover) .panel-left  .panel-title {
            opacity: 0.28;
        }

        /* Thin reveal line beneath title */
        .panel-rule {
            width: 0;
            height: 1px;
            background: var(--cream);
            margin-top: 1.1rem;
            opacity: 0.65;
            transition: width 0.75s cubic-bezier(0.76, 0, 0.17, 1) 0.08s;
        }

        .panel:hover .panel-rule { width: 60px; }

        .split-container:has(.panel-left:hover)  .panel-right .panel-rule,
        .split-container:has(.panel-right:hover) .panel-left  .panel-rule {
            width: 0;
        }

        /* ── VERTICAL DIVIDER ───────────────────────────── */
        .divider {
            position: absolute;
            left: 50%;
            top: 9%;
            bottom: 9%;
            width: 1px;
            transform: translateX(-50%);
            background: linear-gradient(
                to bottom,
                transparent          0%,
                var(--gold-line)     18%,
                var(--gold-line)     82%,
                transparent         100%
            );
            z-index: 50;
            pointer-events: none;
            transition: opacity 0.5s ease;
        }

        .split-container:has(.panel:hover) .divider { opacity: 0; }
    </style>
</head>
<body>

    <!-- Navigation -->
    <nav>
        <div></div>
        <a href="/" class="logo">
            <img src="content/logo.png" alt="Sets and Stories">
        </a>
        <a href="contact.html" class="nav-contact">Contact</a>
    </nav>

    <!-- Split Screen -->
    <div class="split-container">

        <div class="divider"></div>

        <!-- Left — Set Design -->
        <a href="set-design.html" class="panel panel-left">
            <img
                src="content/landing%20page/set_design.png"
                alt="Set Design"
                class="panel-image"
            >
            <div class="panel-overlay"></div>
            <div class="panel-label">
                <span class="panel-title">Set Design</span>
                <div class="panel-rule"></div>
            </div>
        </a>

        <!-- Right — Interior Design -->
        <a href="interior-design.html" class="panel panel-right">
            <img
                src="content/landing%20page/interior_design.png"
                alt="Interior Design"
                class="panel-image"
            >
            <div class="panel-overlay"></div>
            <div class="panel-label">
                <span class="panel-title">Interior Design</span>
                <div class="panel-rule"></div>
            </div>
        </a>

    </div>

</body>
</html>
